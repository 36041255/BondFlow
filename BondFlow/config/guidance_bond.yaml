  guidance:
    list:
      - name: soft_bond_count
        mode: at_least_N                        # exact_N / exact_N_topk / at_least_N
        target_N: 1                        # 目标键数量
        power_sum_beta: 1
        weight: 2                     # 步长（原eta）- 减小步长
        region: "A|A"
        region_mode: include  # 或 "exclude"
        n_steps: 5                           # 内部梯度下降步数
        eps: 1e-8                             # 数值稳定性参数
        schedule: exp                        # 时间调度: linear/quadratic/cosine/exp/inverse (linear 更稳定，避免采样后期能量激增)
        power: 0
        min_t: 0.002                            # 最小时间阈值：当 1-t < min_t 时，用 min_t 替代 1-t 计算权重，确保采样早期guidance有最小权重
        entropy_weight: 0.05
        min_bond_distance: 3              # 最小键距离：抑制距离 <= 3 的残基之间的键（|i-j| <= 3）
        suppress_adjacent_weight: 0.1    # 相邻键抑制的权重（越大抑制越强）